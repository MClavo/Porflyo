AWSTemplateFormatVersion: "2010-09-09"
Resources:
    DynamoDBTable:
        Type: "AWS::DynamoDB::Table"
        Properties:
            AttributeDefinitions: 
              - 
                AttributeName: "PID"
                AttributeType: "S"
              - 
                AttributeName: "PK"
                AttributeType: "S"
              - 
                AttributeName: "SK"
                AttributeType: "S"
            BillingMode: "PROVISIONED"
            TableName: "user"
            KeySchema: 
              - 
                AttributeName: "PK"
                KeyType: "HASH"
              - 
                AttributeName: "SK"
                KeyType: "RANGE"
            ProvisionedThroughput: 
                ReadCapacityUnits: 15
                WriteCapacityUnits: 15
            GlobalSecondaryIndexes: 
              - 
                IndexName: "provider-user-id-index"
                KeySchema: 
                  - 
                    AttributeName: "PID"
                    KeyType: "HASH"
                Projection: 
                    ProjectionType: "ALL"
                ProvisionedThroughput: 
                    ReadCapacityUnits: 3
                    WriteCapacityUnits: 3

    DynamoDBTable2:
        Type: "AWS::DynamoDB::Table"
        Properties:
            AttributeDefinitions: 
              - 
                AttributeName: "PK"
                AttributeType: "S"
              - 
                AttributeName: "SK"
                AttributeType: "S"
            BillingMode: "PROVISIONED"
            TableName: "metrics"
            KeySchema: 
              - 
                AttributeName: "PK"
                KeyType: "HASH"
              - 
                AttributeName: "SK"
                KeyType: "RANGE"
            ProvisionedThroughput: 
                ReadCapacityUnits: 7
                WriteCapacityUnits: 7

