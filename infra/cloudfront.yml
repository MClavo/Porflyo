AWSTemplateFormatVersion: "2010-09-09"
Resources:
  CloudFrontDistribution:
    Type: "AWS::CloudFront::Distribution"
    Properties:
      DistributionConfig:
        Aliases:
          - "www.porflyo.com"
        Origins:
          - ConnectionAttempts: 3
            ConnectionTimeout: 10
