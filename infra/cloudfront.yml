              - "DELETE"
              - "POST"
              - "GET"
              - "OPTIONS"
              - "PUT"
              - "PATCH"
            Compress: true
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
            PathPattern: "/api/*"
            SmoothStreaming: false
            TargetOriginId: "api-gw-origin"
            ViewerProtocolPolicy: "redirect-to-https"
          - AllowedMethods:
              - "HEAD"
              - "DELETE"
              - "POST"
              - "GET"
              - "OPTIONS"
              - "PUT"
              - "PATCH"
            Compress: true
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
            PathPattern: "/public/*"
            SmoothStreaming: false
            TargetOriginId: "api-gw-origin"
            ViewerProtocolPolicy: "redirect-to-https"
          - AllowedMethods:
              - "HEAD"
              - "GET"
              - "OPTIONS"
            Compress: true
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
            PathPattern: "/auth"
            SmoothStreaming: false
            TargetOriginId: "api-gw-origin"
            ViewerProtocolPolicy: "redirect-to-https"
          - AllowedMethods:
              - "HEAD"
              - "GET"
              - "OPTIONS"
            Compress: true
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
            PathPattern: "/logout"
            SmoothStreaming: false
            TargetOriginId: "api-gw-origin"
            ViewerProtocolPolicy: "redirect-to-https"
          - AllowedMethods:
              - "HEAD"
              - "DELETE"
              - "POST"
              - "GET"
              - "OPTIONS"
              - "PUT"
              - "PATCH"
            Compress: true
            CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
            OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
            PathPattern: "/metrics/*"
            SmoothStreaming: false
            TargetOriginId: "api-gw-origin"
            ViewerProtocolPolicy: "redirect-to-https"
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: "/index.html"
            ResponseCode: "200"
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: "/index.html"
            ResponseCode: "200"
            ErrorCachingMinTTL: 0
